<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>天书劫 4.0 · 网页版</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas {
    display: block;
    image-rendering: auto;
    background: #000; outline: none;
    position: absolute; left: 50%; top: 50%;
    transform-origin: 50% 50%;
    will-change: transform;
    /* Sony 特丽珑监视器（PVM/BVM）机壳：近直角、深灰哑光、厚黑遮光罩 */
    border-radius: 3px;
    /* PVM 的管子对比度比一般电视高，加上 shader 吃掉的那部分一起补回来，
       亮度略提以免扫描线把暗部文字压没 */
    filter: brightness(1.06) contrast(1.08) saturate(1.07);
    box-shadow:
      inset 0 0 0 5px #000,
      inset 0 0 0 6px #1C1C1E,
      inset 0 0 24px rgba(0,0,0,.72),
      0 0 0 1px #4A4A4E,
      0 0 0 8px #35353A,
      0 0 0 9px #202024,
      0 0 0 10px #101012,
      0 14px 34px rgba(0,0,0,.85);
  }

  /* CRT 复古滤镜，按 RetroArch crt-geom / crt-guest 的层次拆分：
     ① 荫罩（aperture grille）RGB 三色竖纹，3px 一循环
     ② 扫描线：2px 暗带 + 2px 亮带，模拟电子束逐行扫过的间隙
     ③ 暗角：中心提亮 + 四周压暗，模拟球面玻璃的衰减 */
  /* CRT 合成层：按 RetroArch crt-guest-advanced 的 beam 剖面 + Mega Bezel 的玻璃反光做
     四层自下而上叠：暗角 -> 扫描线 -> 栅格萌罩 -> 玻璃反光 */
  #crtOverlay {
    position: absolute; left: 50%; top: 50%;
    transform-origin: 50% 50%;
    pointer-events: none; z-index: 8;
    border-radius: 3px;
    background:
      /* 1. 玻璃反光：显像管球面的一道斜光，Duimon / Mega Bezel 的 glare 层 */
      linear-gradient(112deg,
        rgba(255,255,255,.11) 0%,
        rgba(255,255,255,.040) 13%,
        rgba(255,255,255,.012) 24%,
        rgba(255,255,255,0) 36%,
        rgba(255,255,255,0) 100%),
      /* 2. 栅格萌罩 aperture grille：RGB 三色 1px 竖纹，对应 maskstr 强度 */
      repeating-linear-gradient(90deg,
        rgba(255,42,42,.085) 0px, rgba(255,42,42,.085) 1px,
        rgba(42,255,42,.085) 1px, rgba(42,255,42,.085) 2px,
        rgba(42,42,255,.085) 2px, rgba(42,42,255,.085) 3px),
      /* 3. 扫描线 beam 剖面：暗 1px + 半暗 1px + 亮 1px（scanline1=2.5, scanline2=36 的观感） */
      repeating-linear-gradient(0deg,
        rgba(0,0,0,.44) 0px, rgba(0,0,0,.44) 1px,
        rgba(0,0,0,.14) 1px, rgba(0,0,0,.14) 2px,
        rgba(0,0,0,0) 2px, rgba(0,0,0,0) 3px),
      /* 4. 暗角：中心微亮、四角压到 .64，模拟球面玻璃衰减 */
      radial-gradient(ellipse 72% 66% at 50% 48%,
        rgba(255,252,240,.10) 0%, rgba(255,252,240,0) 44%,
        rgba(0,0,0,.30) 76%, rgba(0,0,0,.64) 100%);
  }
  /* 监视器铭牌：PVM 的型号字在屏幕右上，避开游戏右下角的按键提示 */
  #crtOverlay::after {
    content: 'SONY  PVM';
    position: absolute; right: 11px; top: 7px;
    font: 700 8px/1 "Arial Narrow", Arial, sans-serif;
    letter-spacing: 2px; color: rgba(226,226,232,.40);
    text-shadow: 0 1px 2px rgba(0,0,0,.9);
  }

  /* 遮罩机身：SFC 限定版的双灰嵌套 —— 外圈浅白上盖，内部嵌一整块中灰面板 */
  #gripL, #gripR {
    position: absolute; display: block; pointer-events: none; z-index: 9;
    background:
      linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.09) 14%, rgba(0,0,0,.03) 54%, rgba(0,0,0,.13) 100%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, rgba(255,255,255,0) 1px 3px),
      linear-gradient(90deg,
        #F4F4F3 0%, #EFEFED 10.5%,
        #A4A4A2 13%, #9E9E9C 36%, #999997 64%, #9E9E9C 87%,
        #EFEFED 89.5%, #F4F4F3 100%);
  }
  #gripL { left: 0; top: 0; border-right: 2px solid rgba(126,126,124,.44);
           box-shadow: inset -9px 0 22px rgba(120,120,118,.18); }
  #gripR { right: 0; top: 0; border-left: 2px solid rgba(126,126,124,.44);
           box-shadow: inset 9px 0 22px rgba(120,120,118,.18); }
  /* 上下两片是外圈的浅白上盖 */
  #gripT { top: 0; border-bottom: 2px solid rgba(126,126,124,.44);
           background: linear-gradient(180deg, #F4F4F3 0%, #E9E9E8 100%);
           box-shadow: inset 0 -7px 18px rgba(120,120,118,.16); }
  #gripB { bottom: 0; border-top: 2px solid rgba(126,126,124,.44);
           background: linear-gradient(180deg, #EFEFED 0%, #E2E2E1 100%);
           box-shadow: inset 0 7px 18px rgba(120,120,118,.16); }
  #gripT::after, #gripB::after { content: none; }

  /* 左机身：竖排 SUPER FAMICOM 红字，取自 Orionsangel / Duimon 的 RA bezel */
  #gripL::before {
    content: 'SUPER FAMICOM';
    position: absolute; left: 50%; margin-left: -5px; top: 7%;
    writing-mode: vertical-rl;
    font: 700 8.5px/1.0 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 1.5px; white-space: nowrap;
    color: #C8322B;
    text-shadow: 0 1px 0 rgba(255,255,255,.40);
  }









  #gripR::before {
    content: ''; position: absolute; left: 50%; margin-left: -13px;
    top: 17%; width: 26px; height: 26px;
    background:
      radial-gradient(circle 6px at 5px 5px, #E23A2E 99%, transparent 100%),
      radial-gradient(circle 6px at 21px 5px, #4FA93F 99%, transparent 100%),
      radial-gradient(circle 6px at 5px 21px, #3B6FD4 99%, transparent 100%),
      radial-gradient(circle 6px at 21px 21px, #F0C427 99%, transparent 100%);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.26));
  }
  /* 红色电源灯：SFC 前面板那颗红点 */
  #gripR::after {
    content: ''; position: absolute; bottom: 9%; left: 50%; margin-left: -4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #FF7A6E 0%, #E8362A 56%, #9E1A12 100%);
    box-shadow: 0 0 9px rgba(232,54,42,.62), inset 0 1px 2px rgba(255,255,255,.55);
  }
  /* 左机身底部：Nintendo 白底小标（RA bezel 的常见符号） */
  #gripL::after {
    content: 'Nintendo';
    position: absolute; bottom: 6.5%; left: 50%; transform: translateX(-50%);
    font: 700 9px/1 -apple-system, "Segoe UI", sans-serif;
    letter-spacing: .3px; color: #3A3A3C;
    padding: 2.5px 7px; border-radius: 9px;
    background: #FAFAF8;
    box-shadow: 0 1px 2px rgba(0,0,0,.16);
  }

  #ctl { position: absolute; inset: 0; pointer-events: none; z-index: 10; }

  /* 按键尺寸由画面等比推导（对应安卓引擎的 CONFIG.KeyScale），见 fitCanvas */
  :root { --pad: 216px; --key: 72px; --btn: 78px; }

  /* 方向键：沿用原版 pic/d1~d4.png 皮肤（上 / 右 / 下 / 左） */
  .pad {
    position: absolute; left: max(10px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    width: var(--pad); height: var(--pad);
    pointer-events: auto;
  }
  /* 手柄模式：方向键居中落在左侧机身（左宽右窄的非对称布局） */
  body.grip .pad {
    left: calc(var(--gapl) * .5 - var(--pad) * .5);
    bottom: auto; top: 50%; transform: translateY(-32%);
    background: none; border-radius: 0;
  }
  /* 连体十字方向盘：一整块十字形状（GBA / FC 掌机那种），四角为按键热区 */
  body.grip .pad::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, #9CA0A4 0%, #7E8286 48%, #585C60 100%);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.34),
      inset 0 -7px 14px rgba(0,0,0,.36),
      0 5px 14px rgba(40,42,46,.42);
    clip-path: polygon(
      33.33% 0,     66.67% 0,     66.67% 33.33%, 100% 33.33%, 100% 66.67%,
      66.67% 66.67%, 66.67% 100%, 33.33% 100%,   33.33% 66.67%, 0 66.67%,
      0 33.33%,      33.33% 33.33%);
  }
  body.grip .pad .k {
    background: none; border: none; border-radius: 0; box-shadow: none;
  }
  body.grip .pad .k.on {
    background: radial-gradient(circle at 50% 50%,
      rgba(255,255,255,.58) 0%, rgba(255,242,180,.24) 68%, rgba(255,255,255,0) 100%);
  }
  .pad .k {
    position: absolute; width: var(--key); height: var(--key);
    background: linear-gradient(180deg, #94989C 0%, #7A7E82 52%, #565A5E 100%);
    border: 2px solid #F4F5F5;
    border-radius: 10px;
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.30),
      inset 0 -4px 8px rgba(0,0,0,.38),
      0 3px 9px rgba(40,42,46,.42);
    transition: transform .08s, filter .08s, box-shadow .08s;
  }
  .pad .k.on {
    transform: scale(.92);
    filter: brightness(1.25);
    box-shadow: inset 0 1px 7px rgba(0,0,0,.72), 0 1px 3px rgba(0,0,0,.4);
  }
  .pad .u { left: var(--key); top: 0;                 background-image: none; }
  .pad .r { left: calc(var(--key) * 2); top: var(--key); background-image: none; }
  .pad .d { left: var(--key); top: calc(var(--key) * 2); background-image: none; }
  .pad .l { left: 0; top: var(--key);                 background-image: none; }

  /* 方向三角标记 */
  .pad .u::before, .pad .r::before, .pad .d::before, .pad .l::before {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 0; height: 0; border-style: solid; border-color: transparent;
  }
  .pad .u::before { border-width: 9px 9px 12px 9px; border-bottom-color: #E8E2CC; margin: -10px 0 0 -9px; }
  .pad .d::before { border-width: 12px 9px 0 9px; border-top-color: #E8E2CC; margin: -2px 0 0 -9px; }
  .pad .l::before { border-width: 9px 12px 9px 0; border-right-color: #E8E2CC; margin: -9px 0 0 -11px; }
  .pad .r::before { border-width: 9px 0 9px 12px; border-left-color: #E8E2CC; margin: -9px 0 0 -1px; }

  .btns {
    position: absolute; right: max(10px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: calc(var(--btn) * .16); align-items: flex-end; pointer-events: auto;
  }
  /* 手柄模式：AB 竖排落在右侧窄机身正中（A 在上、B 在下） */
  body.grip .btns {
    right: calc(var(--gapr) * .5 - var(--btn) * .59);
    bottom: auto; top: 50%; transform: translateY(-50%);
    flex-direction: column; align-items: center;
    gap: calc(var(--btn) * .20);
  }
  .btn {
    width: var(--btn); height: var(--btn);
    position: relative;
    border-radius: 50%;
    background-repeat: no-repeat; background-position: center; background-size: contain;
    transition: transform .08s, filter .08s, box-shadow .08s;
  }
  .btn.on { transform: scale(.92); filter: brightness(1.18); }
  /* 左键 A：超任复刻版的中灰键 + 白色描边 */
  .btn.cancel {
    background: radial-gradient(circle at 36% 30%, #F2736A 0%, #E23A2E 46%, #A81A10 100%);
    border: 2.5px solid rgba(250,250,250,.88);
    box-shadow:
      inset 0 3px 7px rgba(255,255,255,.40),
      inset 0 -6px 12px rgba(0,0,0,.42),
      0 5px 12px rgba(40,42,46,.52);
  }
  .btn.cancel.on { box-shadow: inset 0 2px 10px rgba(0,0,0,.55), 0 2px 5px rgba(40,42,46,.36); }
  /* 右键 B：同色深一档，同样的白描边 */
  .btn.ok {
    width: calc(var(--btn) * 1.18); height: calc(var(--btn) * 1.18);
    background: radial-gradient(circle at 36% 30%, #FBE07E 0%, #F0C427 46%, #C29810 100%);
    border: 2.5px solid rgba(250,250,250,.88);
    box-shadow:
      inset 0 3px 7px rgba(255,255,255,.30),
      inset 0 -6px 12px rgba(0,0,0,.48),
      0 5px 12px rgba(34,36,40,.50);
  }
  .btn.ok.on { box-shadow: inset 0 2px 10px rgba(0,0,0,.62), 0 2px 5px rgba(34,36,40,.38); }
  /* 键面字母 */
  .btn::after {
    pointer-events: none;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font: 700 calc(var(--btn) * .40)/1 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: #FFFDF6; text-shadow: 0 2px 3px rgba(90,20,10,.45);
    letter-spacing: .5px;
  }
  .btn.cancel::after { content: 'A'; }
  .btn.ok::after { content: 'B'; }

  .top {
    position: absolute; right: max(6px, env(safe-area-inset-right));
    top: max(6px, env(safe-area-inset-top));
    display: flex; gap: 6px; pointer-events: auto;
    transition: opacity .45s ease;
  }
  .top.idle { opacity: 0; pointer-events: none; }
  .tool {
    min-width: 56px; height: 30px; padding: 0 10px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(22, 26, 32, .86); border: 1px solid rgba(255,255,255,.30);
    color: #e8eff6; font-size: 13px; font-weight: 500; letter-spacing: .5px;
    box-shadow: 0 2px 10px rgba(0,0,0,.55);
  }
  .tool.on { background: rgba(132, 192, 208, .38); color: #fff; border-color: rgba(160,210,226,.6); }
  .tool.off { opacity: .42; }

  #rotate {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #05070b; color: #cfd8dc; text-align: center; line-height: 1.9;
  }
  #rotate .ic { font-size: 46px; margin-bottom: 12px; animation: spin 2.2s infinite ease-in-out; }
  @keyframes spin { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 820px) {
    #rotate { display: flex; }
  }

  /* ===== 启动层 ===== */
  #boot {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #cfd8dc;
    background: radial-gradient(circle at 50% 40%, #1a2233 0%, #05070b 70%);
    transition: opacity .4s;
  }
  #boot h1 { font-size: 22px; letter-spacing: 5px; margin: 0 0 8px; color: #e8d9a0; font-weight: 500; }
  #boot p  { margin: 5px 0; font-size: 13px; color: #8a97a8; }
  #boot .hint { font-size: 11px; color: #5f6b7a; margin-top: 14px; }
  #bar { width: 236px; height: 4px; background: #1e2735; border-radius: 2px; overflow: hidden; margin-top: 16px; }
  #barInner { width: 0%; height: 100%; background: linear-gradient(90deg,#5b8fb9,#88c0d0); transition: width .25s; }
</style>
</head>
<body>

<div id="stage">
  <div id="gripL"></div>
  <div id="gripR"></div>
  <div id="gripT"></div>
  <div id="gripB"></div>
  <canvas id="canvas" tabindex="0" oncontextmenu="return false"></canvas>
  <div id="crtOverlay"></div>

  <div id="ctl">
    <div class="top" id="topbar">
      <div class="tool" id="btnAudio" title="音乐 / 音效开关">♪ 音频</div>
      <div class="tool" id="btnFull">全屏</div>
    </div>

    <div class="pad" id="pad">
      <div class="k u" data-key="ArrowUp"    data-kc="38"></div>
      <div class="k l" data-key="ArrowLeft"  data-kc="37"></div>
      <div class="k r" data-key="ArrowRight" data-kc="39"></div>
      <div class="k d" data-key="ArrowDown"  data-kc="40"></div>
    </div>

    <div class="btns">
      <div class="btn cancel" data-key="Escape" data-kc="27"></div>
      <div class="btn ok" data-key="Enter" data-kc="13"></div>
    </div>
  </div>
</div>

<div id="rotate">
  <div class="ic">📱</div>
  <div>请横屏握持手机<br><span style="font-size:12px;color:#5f6b7a">横屏后画面与按键才完整可用</span></div>
</div>

<div id="boot">
  <h1>天书劫 4.0</h1>
  <p id="bootMsg">正在装载引擎…</p>
  <div id="bar"><div id="barInner"></div></div>
  <div class="hint">首次加载约 110 MB 资源，请保持网络畅通</div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');

  /* ---------- 画面按 16:9 等比适配（引擎 set.ini 为 1280x720） ---------- */
  /* canvas 始终以原生 1280x720 渲染，显示时用 GPU transform 等比缩放，
     避免 SDL 在缩小后的画布上重绘造成的糊边与视口错位 */
  function fitCanvas() {
    var stage = document.getElementById('stage');
    var w = stage.clientWidth, h = stage.clientHeight;

    /* 调试用：?mock=844x390 可强制按指定视口排版，便于在电脑上预览手机效果 */
    var m = /[?&]mock=(\d+)x(\d+)/.exec(location.search);
    if (m) {
      w = parseInt(m[1], 10); h = parseInt(m[2], 10);
      stage.style.width = w + 'px'; stage.style.height = h + 'px';
      stage.style.left = Math.round((innerWidth - w) / 2) + 'px';
      stage.style.top = Math.round((innerHeight - h) / 2) + 'px';
      stage.style.right = 'auto'; stage.style.bottom = 'auto';
      stage.style.boxShadow = '0 0 0 1px #444';
    } else {
      stage.style.width = ''; stage.style.height = '';
      stage.style.left = ''; stage.style.top = '';
      stage.style.right = ''; stage.style.bottom = '';
      stage.style.boxShadow = '';
    }

    /* 固定 1.5 倍物理放大：源像素 2 个 -> 物理 3 个，最近邻下节奏均匀，
       比 1.625 这类非整数倍干净得多；屏幕放不下时才回落到最大可用倍率 */
    var md = /[?&]dpr=([\d.]+)/.exec(location.search);
    var dpr = md ? parseFloat(md[1]) : (window.devicePixelRatio || 1);
    var kPhysMax = Math.min(w * dpr / 1280, h * dpr / 720);
    var kPhys = Math.min(1.5, kPhysMax);
    var k = kPhys / dpr;

    /* 1.5 倍之后剩下的四边黑边，整圈填成皮卡丘机身。
       左右不对称：画面整体右移，左侧留出更宽的十字键区，右侧只放竖排 AB */
    var dispW = 1280 * k, dispH = 720 * k;
    var totalGapX = Math.max(0, w - dispW);
    var gapY = Math.max(0, (h - dispH) / 2);
    var gapL = Math.round(totalGapX * 0.62);
    var gapR = totalGapX - gapL;
    var cx = gapL + dispW / 2;          /* 画面水平中心（相对 stage 左边缘） */

    /* 两侧都够宽才把十字键 / AB 键挪进机身，否则仍是叠层按键 */
    var gripMode = gapL >= 76 && gapR >= 52;
    document.body.classList.toggle('grip', gripMode);
    document.documentElement.style.setProperty('--gapl', gapL + 'px');
    document.documentElement.style.setProperty('--gapr', gapR + 'px');
    document.documentElement.style.setProperty('--hw', gapL + 'px');
    document.documentElement.style.setProperty('--gapy', gapY + 'px');

    /* 画面：原生 1280x720 渲染，GPU transform 等比缩放 */
    canvas.style.width  = '1280px';
    canvas.style.height = '720px';
    canvas.style.left = cx + 'px';
    canvas.style.transform = 'translate(-50%, -50%) scale(' + k + ')';

    /* CRT 滤镜层跟画面同尺寸同变换，压在最上面 */
    var ov = document.getElementById('crtOverlay');
    ov.style.width = '1280px'; ov.style.height = '720px';
    ov.style.left = cx + 'px';
    ov.style.transform = canvas.style.transform;

    /* 放大用最近邻（同安卓），缩小用双线性 */
    canvas.style.imageRendering = kPhys >= 1 ? 'pixelated' : 'auto';

    /* 四块机身 */
    var gL = document.getElementById('gripL'), gR = document.getElementById('gripR');
    var gT = document.getElementById('gripT'), gB = document.getElementById('gripB');
    gL.style.width = gapL + 'px'; gL.style.height = h + 'px';
    gR.style.width = gapR + 'px'; gR.style.height = h + 'px';
    gT.style.height = gapY + 'px'; gT.style.left = gapL + 'px'; gT.style.width = dispW + 'px';
    gB.style.height = gapY + 'px'; gB.style.left = gapL + 'px'; gB.style.width = dispW + 'px';

    /* 按键尺寸：手柄模式按左侧十字区宽度定，普通宽屏按屏宽 10.8%（对齐安卓占比） */
    var key;
    if (gripMode) {
      /* 十字键 3 颗并排受左侧宽度限制；B 键最宽（1.18 倍）受右侧宽度限制 */
      key = Math.round(Math.min(gapL / 2.66, gapR / 1.66, h * 0.126, 62));
      key = Math.max(key, 24);
    } else {
      key = Math.round(Math.max(42, Math.min(w * 0.108, dispH * 0.2)));
    }
    document.documentElement.style.setProperty('--key', key + 'px');
    document.documentElement.style.setProperty('--pad', (key * 3) + 'px');
    document.documentElement.style.setProperty('--btn', Math.round(key * 1.30) + 'px');
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 280); });
  setTimeout(fitCanvas, 1200);

  /* ---------- 键盘事件注入 ---------- */
  var SPECIAL = { 13: 'Enter', 27: 'Escape', 32: ' ', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown' };

  function dispatch(type, keyCode) {
    var key = SPECIAL[keyCode] || String.fromCharCode(keyCode);
    var ev = new KeyboardEvent(type, {
      key: key, code: key, keyCode: keyCode, which: keyCode,
      charCode: type === 'keydown' ? keyCode : 0,
      bubbles: true, cancelable: true, composed: true
    });
    /* Emscripten 的 SDL 键盘监听挂在 document / window 上 */
    document.dispatchEvent(ev);
    try { window.dispatchEvent(ev); } catch (e) {}
  }

  var held = {};
  var holdTimer = null, holdRepeat = null;
  function stopRepeat() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (holdRepeat) { clearInterval(holdRepeat); holdRepeat = null; }
  }
  function down(code) {
    if (held[code]) return;
    held[code] = 1;
    dispatch('keydown', code);
    stopRepeat();
    /* 游戏是"一次 KEYDOWN 走一步"，按住不放要模拟系统按键重复 */
    holdTimer = setTimeout(function () {
      holdRepeat = setInterval(function () { dispatch('keydown', code); }, 85);
    }, 240);
  }
  function up(code) {
    if (!held[code]) return;
    delete held[code];
    stopRepeat();
    dispatch('keyup', code);
  }

  /* ---------- 虚拟按键绑定 ---------- */
  document.querySelectorAll('[data-key]').forEach(function (el) {
    var kc = parseInt(el.getAttribute('data-kc'), 10);
    function press(e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.add('on');
      down(kc);
    }
    function release(e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('on');
      up(kc);
    }
    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release, { passive: false });
    el.addEventListener('pointercancel', release, { passive: false });
    el.addEventListener('pointerleave', release, { passive: false });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  /* ---------- 键盘兜底：桌面端真实键也走同一套 ---------- */
  window.addEventListener('keydown', function (e) { if (SPECIAL[e.keyCode] || e.keyCode) held[e.keyCode] = 1; });
  window.addEventListener('keyup', function (e) { delete held[e.keyCode]; });

  /* ---------- 工具栏：3 秒后自动淡出，触屏唤起 ---------- */
  var topbar = document.getElementById('topbar');
  var topTimer = null;
  function showTop() {
    topbar.classList.remove('idle');
    clearTimeout(topTimer);
    topTimer = setTimeout(function () { topbar.classList.add('idle'); }, 3000);
  }
  document.addEventListener('pointerdown', showTop, { passive: true });
  showTop();

  /* ---------- 全屏 ---------- */
  var btnFull = document.getElementById('btnFull');
  var canFull = !!(document.documentElement.requestFullscreen ||
                   document.documentElement.webkitRequestFullscreen);
  if (!canFull) {
    btnFull.style.display = 'none';
  } else {
    btnFull.addEventListener('click', function () {
      var el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        var p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        /* 手机全屏后锁横屏，避免竖屏每次转来转去 */
        try {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(function () {});
          }
        } catch (e) {}
        if (p && p.then) p.then(function () { setTimeout(fitCanvas, 260); });
        btnFull.classList.add('on');
      } else {
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        btnFull.classList.remove('on');
      }
    });
  }

  /* ---------- 声音：一键静音 / 恢复（BGM 与音效一起） ---------- */
  document.getElementById('btnAudio').addEventListener('click', function () {
    this.classList.toggle('off');
    var muted = this.classList.contains('off');
    this.textContent = muted ? '♪ 静音' : '♪ 音频';
    try {
      if (Module.audioCtx && Module.audioCtx.state === 'suspended') Module.audioCtx.resume();
      if (Module.JYAudio) {
        Module.JYAudio.resume();
        if (Module.JYAudio.setMuted) Module.JYAudio.setMuted(muted);
      }
    } catch (e) {}
  }, { passive: true });

  /* ---------- 首次触摸解锁 canvas 焦点 ---------- */
  document.addEventListener('pointerdown', function once() {
    try { canvas.focus(); } catch (e) {}
    document.removeEventListener('pointerdown', once);
  }, { once: true, passive: true });
})();

/* ---------- Emscripten Module ---------- */
/* ---------- 大小写别名修复 ----------
     游戏 lua 里资源名全小写（mmap.col / earth.002 / surface.002 / war.sta ...），
     而数据包里是 Mmap.col / Earth.002 / Surface.002 / War.sta。
     Linux(网页 MEMFS) 区分大小写 -> 调色板打不开 -> m_color32 全 0 -> 地图人物全黑。
     这里在引擎 main 跑起来之前，给所有含大写字母的资源补一份全小写副本。 */
function jyCaseFixNow() {
    try {
      var FS = Module.FS;
      if (!FS) return;
      var made = 0;
      function walk(dir) {
        var names;
        try { names = FS.readdir(dir); } catch (e) { return; }
        for (var i = 0; i < names.length; i++) {
          var n = names[i];
          if (n === '.' || n === '..') continue;
          var p = dir + '/' + n;
          var st;
          try { st = FS.stat(p); } catch (e) { continue; }
          try { if (FS.isDir(st.mode)) { walk(p); continue; } } catch (e) {}

          var low = n.toLowerCase();
          if (low === n) continue;
          var lp = dir + '/' + low;
          var exists = true;
          try { FS.stat(lp); } catch (e) { exists = false; }
          if (exists) continue;
          try { FS.writeFile(lp, FS.readFile(p)); made++; } catch (e) {}
        }
      }
      walk('/');
      walk('/data');
      walk('/data/fight');
      /* config 的 JYMain_Lua = "jymain.lua"，引擎在根目录直接 loadfile，
         而数据包里它位于 /script 下，补一份根目录副本 */
      try {
        var hasRoot = true;
        try { FS.stat('/jymain.lua'); } catch (e) { hasRoot = false; }
        if (!hasRoot) {
          var hasScript = true;
          try { FS.stat('/script/jymain.lua'); } catch (e) { hasScript = false; }
          if (hasScript) {
            FS.writeFile('/jymain.lua', FS.readFile('/script/jymain.lua'));
            window.__jymainCopied = true;
          }
        }
      } catch (e) {}
      window.__caseFixMade = made;
    } catch (e) {}
}

/* ---------- 游戏数据注入 -------------
   新引擎（干净黑山源码 + emcc）不带 --preload-file，改由这里手工把
   game.data（93.8MB，纯内容拼接）按 data-manifest.json 的清单铺进 MEMFS。
   清单来自旧 game.js 的 loadPackage，1502 个文件，末位偏移与包体严格闭合。 */
function loadGameData() {
  var msg = function (t) { var el = document.getElementById('bootMsg'); if (el) el.textContent = t; };
  var bar = function (p) { var el = document.getElementById('barInner'); if (el) el.style.width = p + '%'; };
  return fetch('data-manifest.json').then(function (r) { return r.json(); }).then(function (manifest) {
    msg('正在下载游戏数据（93.8 MB）…');
    return fetch('game.data').then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      msg('正在铺入虚拟文件系统…'); bar(100);
      var u8 = new Uint8Array(buf);
      var FS = Module.FS, i, f, d;
      for (i = 0; i < manifest.length; i++) {
        f = manifest[i].filename;
        d = f.substring(0, f.lastIndexOf('/'));
        if (d) { try { FS.mkdirTree(d); } catch (e) {} }
      }
      for (i = 0; i < manifest.length; i++) {
        f = manifest[i];
        try { FS.writeFile(f.filename, u8.subarray(f.start, f.end)); }
        catch (e) { console.error('写入失败: ' + f.filename, e); }
      }
      window.__dataInjected = manifest.length;
      msg('');
    });
  });
}

var Module = {
  canvas: (function () { return document.getElementById('canvas'); })(),
  arguments: [],
  noInitialRun: true,
  preRun: [],
  print: function (t) { (window.__log = window.__log || []).push('print: ' + t); console.log(t); },
  printErr: function (t) { (window.__log = window.__log || []).push('err: ' + t); console.error(t); },
  setStatus: function (t) {
    if (!Module.setStatus.last) Module.setStatus.last = { time: 0, text: '' };
    var el = document.getElementById('bootMsg');
    if (el && t) el.textContent = t;
    var m = t && t.match(/Downloading data\.\.\. \(([0-9.]+)\/([0-9.]+)/);
    if (m) document.getElementById('barInner').style.width =
      (100 * parseFloat(m[1]) / parseFloat(m[2])).toFixed(0) + '%';
  },
  monitorRunDependencies: function (left) {
    if (Module.setStatus.last && Module.setStatus.last.text) Module.setStatus(Module.setStatus.last.text);
    if (left === 0) Module.setStatus('');
  },
  onRuntimeInitialized: function () {
    /* 运行时就绪但 main 尚未跑（noInitialRun:true）：先铺数据，再手工 callMain */
    loadGameData().then(function () {
      try { jyCaseFixNow(); } catch (e) {}
      /* set.ini 补音乐开关：游戏脚本的 JY.EnableMusic 取自 CONFIG.ENABLEMUSIC，
         包内的 set.ini 没有该字段，导致 Lua 层跳过所有 PlayMIDI 调用。
         这里按字节追加（原文件是 GBK，不能整体解码重写）。 */
      try {
        var sp = '/set.ini';
        var sd = Module.FS.readFile(sp);
        var stxt = '';
        for (var si = 0; si < sd.length; si++) stxt += String.fromCharCode(sd[si]);
        if (stxt.indexOf('ENABLEMUSIC') < 0) {
          var sadd = new Uint8Array(new TextEncoder().encode('\nCONFIG.ENABLEMUSIC = 1\nCONFIG.EnableMusic = 1\n'));
          var sout = new Uint8Array(sd.length + sadd.length);
          sout.set(sd, 0); sout.set(sadd, sd.length);
          Module.FS.writeFile(sp, sout);
          console.log('[PATCH] set.ini += ENABLEMUSIC=1');
        }
      } catch (e) { console.warn('patch set.ini failed', e); }
      var b = document.getElementById('boot');
      if (b) { b.style.opacity = '0'; setTimeout(function () { b.style.display = 'none'; }, 420); }
      try { Module.callMain([]); }
      catch (e) { var el = document.getElementById('bootMsg'); if (el) el.textContent = '引擎启动失败: ' + e; console.error(e); }
    }).catch(function (e) {
      var el = document.getElementById('bootMsg');
      if (el) el.textContent = '数据加载失败: ' + (e && e.message ? e.message : e);
      console.error(e);
    });
  }
};

/* ==================================================================
   游戏音频引擎（Web Audio）—— 承接引擎的 BASS 调用
   音效：data/sound 下 .wav 按需解码并缓存
   BGM(MIDI)：SpessaSynth WorkletSynthesizer + 游戏自带 data/sound/mid.sf2（原版音色）
   音效(WAV)：WebAudio decodeAudioData 直接播放
   ================================================================== */
window.JYAudio = Module.JYAudio = (function () {
  var ctx = null, synth = null, seq = null, mod = null;
  var masterGain = null, musicGain = null, sfxGain = null;
  var initPromise = null, ready = false, failed = false;
  var musicVol = 1.0, sfxVol = 1.0;
  var muted = false;
  var wantPath = null;
  var sfxCached = {};
  var soundList = null;
  var log = function (s) {
    (window.__alog = window.__alog || []).push(String(s));
    console.log('[JYAudio] ' + s);
  };

  function buildSoundList() {
    if (soundList) return soundList;
    soundList = {};
    try {
      Module.FS.readdir('/data/sound').forEach(function (n) {
        if (n === '.' || n === '..') return;
        soundList[n.toLowerCase()] = '/data/sound/' + n;
      });
    } catch (e) { log('readdir /data/sound 失败: ' + e); }
    return soundList;
  }

  function resolve(p) {
    if (!p) return null;
    var s = String(p).replace(/\\/g, '/');
    var name = s.split('/').pop().toLowerCase();
    if (!name) return null;
    var list = buildSoundList();
    if (list[name]) return list[name];
    /* 游戏脚本按 MP3 后缀拼曲名（data/sound/game17.mp3），包内实际存放的是 .MID/.WAV */
    var base = name.replace(/\.[a-z0-9]+$/, '');
    var alts = [base + '.mid', base + '.midi', base + '.mid.mp3', base + '.wav'];
    for (var a = 0; a < alts.length; a++) { if (list[alts[a]]) return list[alts[a]]; }
    var cands = s.charAt(0) === '/' ? [s] : [s, '/' + s];
    for (var i = 0; i < cands.length; i++) {
      try { Module.FS.stat(cands[i]); return cands[i]; } catch (e) {}
    }
    return null;
  }

  function readBytes(full) {
    var d = Module.FS.readFile(full);
    var u8 = new Uint8Array(d.length);
    u8.set(d);
    return u8;
  }

  function ensureCtx() {
    if (ctx) return true;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctx.createGain();
      masterGain.gain.value = 1.0;
      masterGain.connect(ctx.destination);
      musicGain = ctx.createGain();
      musicGain.gain.value = musicVol;
      musicGain.connect(masterGain);
      sfxGain = ctx.createGain();
      sfxGain.gain.value = sfxVol;
      sfxGain.connect(masterGain);
      return true;
    } catch (e) { log('AudioContext 创建失败: ' + e); ctx = null; return false; }
  }

  function init() {
    if (initPromise) return initPromise;
    if (!ensureCtx()) { failed = true; return Promise.resolve(); }
    initPromise = import('./synth.js').then(function (m) {
      mod = m;
      log('synth.js 已载入');
      return ctx.audioWorklet.addModule('./spessasynth_processor.min.js');
    }).then(function () {
      synth = new mod.WorkletSynthesizer(ctx);
      return synth.isReady;
    }).then(function () {
      log('合成器就绪');
      var sf = readBytes('/data/sound/mid.sf2');
      log('音色库 ' + sf.length + ' 字节');
      return synth.soundBankManager.addSoundBank(sf.buffer, 'game');
    }).then(function () {
      var wired = false;
      try { synth.connect(musicGain); wired = true; } catch (e1) {}
      if (!wired) {
        try { synth.worklet.connect(musicGain); } catch (e2) { log('输出连接失败: ' + e2); }
      }
      seq = new mod.Sequencer(synth);
      ready = true;
      log('音色库加载完成');
      if (wantPath) { var p = wantPath; wantPath = null; startMidi(p); }
    }).catch(function (e) {
      failed = true;
      log('音频初始化失败: ' + (e && e.message ? e.message : e));
    });
    return initPromise;
  }

  function startMidi(full) {
    if (!ready || !synth) { wantPath = full; return; }
    try {
      var u8 = readBytes(full);
      var name = full.split('/').pop();
      try { if (seq) seq.pause(); } catch (e) {}
      seq = new mod.Sequencer(synth);
      seq.loopCount = Infinity;
      seq.shuffleSongs = false;
      seq.loadNewSongList([{ binary: u8.buffer, fileName: name }]);
      seq.play();
      log('播放 ' + name + ' (' + u8.length + 'B)');
    } catch (e) { log('播放失败 ' + (e && e.message ? e.message : e)); }
  }

  function spawnSfx(buf) {
    if (!buf || !sfxGain) return;
    try {
      var src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(sfxGain);
      src.start(0);
    } catch (e) {}
  }

  function playSfxFile(full) {
    var name = full.split('/').pop().toLowerCase();
    var c = sfxCached[name];
    if (c === 0) return;
    if (c) { spawnSfx(c); return; }
    var u8;
    try { u8 = readBytes(full); } catch (e) { return; }
    if (!u8.length) { sfxCached[name] = 0; return; }
    ctx.decodeAudioData(u8.buffer, function (b) {
      sfxCached[name] = b;
      spawnSfx(b);
    }, function (err) {
      sfxCached[name] = 0;
      log('音效解码失败 ' + name + ': ' + err);
    });
  }

  return {
    /* ---- C 侧 bass_shim.c 的 EM_JS 调用 ---- */
    playMidi: function (path) {
      if (!ensureCtx()) return;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      var full = resolve(path);
      if (!full) { log('找不到音乐 ' + path); return; }
      if (ready) startMidi(full);
      else { wantPath = full; init(); }
    },
    stopMidi: function () {
      wantPath = null;
      try { if (seq) seq.pause(); } catch (e) {}
    },
    setMusicVolume: function (v) {
      musicVol = Math.max(0, Math.min(2, v));
      if (musicGain) {
        /* 原版走 BASS 音量 20/100，WebAudio 线性增益下会明显偏轻，用幂曲线提亮 */
        var g = musicVol <= 0 ? 0 : Math.min(1.35, Math.pow(musicVol, 0.4) * 1.25);
        musicGain.gain.value = g;
      }
    },
    playSfx: function (path) {
      if (!ensureCtx()) return;
      var full = resolve(path);
      if (!full) return;
      if (!ready && !failed) init();
      playSfxFile(full);
    },
    setSfxVolume: function (v) {
      sfxVol = Math.max(0, Math.min(2, v));
      if (sfxGain) sfxGain.gain.value = sfxVol;
    },
    setMuted: function (m) {
      muted = !!m;
      if (masterGain) masterGain.gain.value = muted ? 0 : 1;
      return muted;
    },

    /* ---- 页面用 ---- */
    resume: function () {
      if (!ensureCtx()) return 0;
      if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
      if (!ready && !failed) init();
      return 1;
    },
    status: function () {
      return {
        ctx: ctx ? ctx.state : 'none',
        ready: ready, failed: failed,
        sfxDecoded: Object.keys(sfxCached).length,
        seqTime: seq ? Math.round(seq.currentTime) : -1,
        musicVol: musicVol, sfxVol: sfxVol
      };
    }
  };
})();

/* 首次触摸解锁音频 */
window.addEventListener('pointerdown', function () {
  try { Module.JYAudio && Module.JYAudio.resume(); } catch (e) {}
}, { passive: true });
</script>
<script>
/* game.data（93.8MB）超过 GitHub 网页 25MB 单文件上限，仓库里以 game.data.001~004
   分片存放，由 sw.js 在 fetch 时拼回整包。game.js 必须等 SW 接管后再加载。 */
(function () {
  var started = false;
  function start() {
    if (started) return;
    started = true;
    var s = document.createElement('script');
    s.src = 'game.js';
    document.body.appendChild(s);
  }
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') {
    start();
    return;
  }
  setTimeout(start, 12000);         // 兜底：SW 12 秒没 ready 就直接加载（start 只执行一次）
  navigator.serviceWorker.register('sw.js').then(function () {
    return navigator.serviceWorker.ready;
  }).then(function () {
    start();                        // activate 里的 clients.claim() 已接管本页，不需要 reload
  }).catch(function (e) {
    console.warn('SW register failed:', e);
    start();
  });
})();
</script>
