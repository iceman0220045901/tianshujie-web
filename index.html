<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>天书劫 4.0 · 网页版</title>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000; outline: none;
  }

  /* ===== 控制层 ===== */
  #ctl { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .pad {
    position: absolute; left: max(14px, env(safe-area-inset-left));
    bottom: max(18px, env(safe-area-inset-bottom));
    width: 168px; height: 168px;
    pointer-events: auto;
  }
  .pad .k {
    position: absolute; width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(210, 200, 170, .16); border: 1px solid rgba(210, 200, 170, .42);
    border-radius: 12px; color: #e8dfc0; font-size: 22px; line-height: 1;
    backdrop-filter: blur(2px);
    transition: background .08s, transform .08s;
  }
  .pad .k.on { background: rgba(232, 217, 160, .55); transform: scale(.94); }
  .pad .u { left: 56px; top: 0; }
  .pad .l { left: 0;   top: 56px; }
  .pad .r { left: 112px; top: 56px; }
  .pad .d { left: 56px; top: 112px; }

  .btns {
    position: absolute; right: max(14px, env(safe-area-inset-right));
    bottom: max(18px, env(safe-area-inset-bottom));
    display: flex; gap: 14px; align-items: flex-end; pointer-events: auto;
  }
  .btn {
    width: 68px; height: 68px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(180, 60, 55, .30); border: 1.5px solid rgba(232, 160, 150, .55);
    color: #ffe9e4; font-size: 15px; letter-spacing: 1px;
    backdrop-filter: blur(2px);
    transition: background .08s, transform .08s;
  }
  .btn small { font-size: 10px; opacity: .65; margin-top: 2px; letter-spacing: 0; }
  .btn.on { background: rgba(226, 92, 82, .75); transform: scale(.94); }
  .btn.big { width: 78px; height: 78px; }

  .top {
    position: absolute; right: max(6px, env(safe-area-inset-right));
    top: max(6px, env(safe-area-inset-top));
    display: flex; gap: 6px; pointer-events: auto;
    transition: opacity .45s ease;
  }
  .top.idle { opacity: 0; pointer-events: none; }
  .tool {
    min-width: 40px; height: 26px; padding: 0 8px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.46); border: 1px solid rgba(255,255,255,.14);
    color: #9aa6b2; font-size: 11px; letter-spacing: .5px;
  }
  .tool.on { background: rgba(132, 192, 208, .38); color: #fff; border-color: rgba(160,210,226,.6); }
  .tool.off { opacity: .42; }

  #rotate {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    background: #05070b; color: #cfd8dc; text-align: center; line-height: 1.9;
  }
  #rotate .ic { font-size: 46px; margin-bottom: 12px; animation: spin 2.2s infinite ease-in-out; }
  @keyframes spin { 0%,40% { transform: rotate(0); } 60%,100% { transform: rotate(90deg); } }
  @media (orientation: portrait) and (max-width: 820px) {
    #rotate { display: flex; }
  }

  /* ===== 启动层 ===== */
  #boot {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #cfd8dc;
    background: radial-gradient(circle at 50% 40%, #1a2233 0%, #05070b 70%);
    transition: opacity .4s;
  }
  #boot h1 { font-size: 22px; letter-spacing: 5px; margin: 0 0 8px; color: #e8d9a0; font-weight: 500; }
  #boot p  { margin: 5px 0; font-size: 13px; color: #8a97a8; }
  #boot .hint { font-size: 11px; color: #5f6b7a; margin-top: 14px; }
  #bar { width: 236px; height: 4px; background: #1e2735; border-radius: 2px; overflow: hidden; margin-top: 16px; }
  #barInner { width: 0%; height: 100%; background: linear-gradient(90deg,#5b8fb9,#88c0d0); transition: width .25s; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="canvas" tabindex="0" oncontextmenu="return false"></canvas>
</div>

<div id="ctl">
  <div class="top" id="topbar">
    <div class="tool off" id="btnAudio" title="当前版本为无声版">无声版</div>
    <div class="tool" id="btnFull">全屏</div>
  </div>

  <div class="pad" id="pad">
    <div class="k u" data-key="ArrowUp"    data-kc="38">▲</div>
    <div class="k l" data-key="ArrowLeft"  data-kc="37">◀</div>
    <div class="k r" data-key="ArrowRight" data-kc="39">▶</div>
    <div class="k d" data-key="ArrowDown"  data-kc="40">▼</div>
  </div>

  <div class="btns">
    <div class="btn" data-key="Escape" data-kc="27">取消<small>ESC</small></div>
    <div class="btn big" data-key="Enter" data-kc="13">确定<small>ENTER</small></div>
  </div>
</div>

<div id="rotate">
  <div class="ic">📱</div>
  <div>请横屏握持手机<br><span style="font-size:12px;color:#5f6b7a">横屏后画面与按键才完整可用</span></div>
</div>

<div id="boot">
  <h1>天书劫 4.0</h1>
  <p id="bootMsg">正在装载引擎…</p>
  <div id="bar"><div id="barInner"></div></div>
  <div class="hint">首次加载约 110 MB 资源，请保持网络畅通</div>
</div>

<script>
(function () {
  var canvas = document.getElementById('canvas');

  /* ---------- 画面按 16:9 等比适配（引擎 set.ini 为 1280x720） ---------- */
  function fitCanvas() {
    var stage = document.getElementById('stage');
    var w = stage.clientWidth, h = stage.clientHeight;
    var AR = 1280 / 720;
    var W = w, H = w / AR;
    if (H > h) { H = h; W = h * AR; }
    canvas.style.width  = Math.round(W) + 'px';
    canvas.style.height = Math.round(H) + 'px';
  }
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', function () { setTimeout(fitCanvas, 280); });
  setTimeout(fitCanvas, 1200);

  /* ---------- 键盘事件注入 ---------- */
  var SPECIAL = { 13: 'Enter', 27: 'Escape', 32: ' ', 37: 'ArrowLeft', 38: 'ArrowUp', 39: 'ArrowRight', 40: 'ArrowDown' };

  function dispatch(type, keyCode) {
    var key = SPECIAL[keyCode] || String.fromCharCode(keyCode);
    var ev = new KeyboardEvent(type, {
      key: key, code: key, keyCode: keyCode, which: keyCode,
      charCode: type === 'keydown' ? keyCode : 0,
      bubbles: true, cancelable: true, composed: true
    });
    /* Emscripten 的 SDL 键盘监听挂在 document / window 上 */
    document.dispatchEvent(ev);
    try { window.dispatchEvent(ev); } catch (e) {}
  }

  var held = {};
  function down(code) {
    if (held[code]) return;
    held[code] = 1;
    dispatch('keydown', code);
  }
  function up(code) {
    if (!held[code]) return;
    delete held[code];
    dispatch('keyup', code);
  }

  /* ---------- 虚拟按键绑定 ---------- */
  document.querySelectorAll('[data-key]').forEach(function (el) {
    var kc = parseInt(el.getAttribute('data-kc'), 10);
    function press(e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.add('on');
      down(kc);
    }
    function release(e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('on');
      up(kc);
    }
    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release, { passive: false });
    el.addEventListener('pointercancel', release, { passive: false });
    el.addEventListener('pointerleave', release, { passive: false });
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  });

  /* ---------- 键盘兜底：桌面端真实键也走同一套 ---------- */
  window.addEventListener('keydown', function (e) { if (SPECIAL[e.keyCode] || e.keyCode) held[e.keyCode] = 1; });
  window.addEventListener('keyup', function (e) { delete held[e.keyCode]; });

  /* ---------- 工具栏：3 秒后自动淡出，触屏唤起 ---------- */
  var topbar = document.getElementById('topbar');
  var topTimer = null;
  function showTop() {
    topbar.classList.remove('idle');
    clearTimeout(topTimer);
    topTimer = setTimeout(function () { topbar.classList.add('idle'); }, 3000);
  }
  document.addEventListener('pointerdown', showTop, { passive: true });
  showTop();

  /* ---------- 全屏 ---------- */
  var btnFull = document.getElementById('btnFull');
  var canFull = !!(document.documentElement.requestFullscreen ||
                   document.documentElement.webkitRequestFullscreen);
  if (!canFull) {
    btnFull.style.display = 'none';
  } else {
    btnFull.addEventListener('click', function () {
      var el = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        btnFull.classList.add('on');
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        btnFull.classList.remove('on');
      }
    });
  }

  /* ---------- 声音（当前为桩静音，按钮仅作状态提示） ---------- */
  document.getElementById('btnAudio').addEventListener('click', function () {
    try {
      if (Module.audioCtx && Module.audioCtx.state === 'suspended') Module.audioCtx.resume();
    } catch (e) {}
  }, { passive: true });

  /* ---------- 首次触摸解锁 canvas 焦点 ---------- */
  document.addEventListener('pointerdown', function once() {
    try { canvas.focus(); } catch (e) {}
    document.removeEventListener('pointerdown', once);
  }, { once: true, passive: true });
})();

/* ---------- Emscripten Module ---------- */
var Module = {
  canvas: (function () { return document.getElementById('canvas'); })(),
  arguments: [],
  /* ---------- 大小写别名修复 ----------
     游戏 lua 里资源名全小写（mmap.col / earth.002 / surface.002 / war.sta ...），
     而数据包里是 Mmap.col / Earth.002 / Surface.002 / War.sta。
     Linux(网页 MEMFS) 区分大小写 -> 调色板打不开 -> m_color32 全 0 -> 地图人物全黑。
     这里在引擎 main 跑起来之前，给所有含大写字母的资源补一份全小写副本。 */
  preRun: [function jyCaseFix() {
    try {
      var FS = Module.FS;
      if (!FS) return;
      var made = 0;
      function walk(dir) {
        var names;
        try { names = FS.readdir(dir); } catch (e) { return; }
        for (var i = 0; i < names.length; i++) {
          var n = names[i];
          if (n === '.' || n === '..') continue;
          var p = dir + '/' + n;
          var st;
          try { st = FS.stat(p); } catch (e) { continue; }
          try { if (FS.isDir(st.mode)) { walk(p); continue; } } catch (e) {}

          var low = n.toLowerCase();
          if (low === n) continue;
          var lp = dir + '/' + low;
          var exists = true;
          try { FS.stat(lp); } catch (e) { exists = false; }
          if (exists) continue;
          try { FS.writeFile(lp, FS.readFile(p)); made++; } catch (e) {}
        }
      }
      walk('/');
      walk('/data');
      walk('/data/fight');
      window.__caseFixMade = made;
    } catch (e) {}
  }],
  print: function (t) { (window.__log = window.__log || []).push('print: ' + t); console.log(t); },
  printErr: function (t) { (window.__log = window.__log || []).push('err: ' + t); console.error(t); },
  setStatus: function (t) {
    if (!Module.setStatus.last) Module.setStatus.last = { time: 0, text: '' };
    var el = document.getElementById('bootMsg');
    if (el && t) el.textContent = t;
    var m = t && t.match(/Downloading data\.\.\. \(([0-9.]+)\/([0-9.]+)/);
    if (m) document.getElementById('barInner').style.width =
      (100 * parseFloat(m[1]) / parseFloat(m[2])).toFixed(0) + '%';
  },
  monitorRunDependencies: function (left) {
    if (Module.setStatus.last && Module.setStatus.last.text) Module.setStatus(Module.setStatus.last.text);
    if (left === 0) Module.setStatus('');
  },
  onRuntimeInitialized: function () {
    var b = document.getElementById('boot');
    if (b) { b.style.opacity = '0'; setTimeout(function () { b.style.display = 'none'; }, 420); }
  }
};

/* ==================================================================
   游戏音频引擎（Web Audio）—— 承接引擎的 BASS 调用
   音效：预解码 data/sound 下全部 .wav，播放时零延迟
   BGM(MIDI)：登记句柄、状态正常但暂不发声（后续接 SF2 合成）
   ================================================================== */
Module.JYAudio = (function () {
  var AC = null, master = null, analyser = null;
  var cache = {};          /* key(小写路径) -> AudioBuffer */
  var pathIdx = null;      /* key(小写相对路径) -> 真实路径 */
  var handles = {};        /* id -> {key, kind, vol, loop, src, gain, playing} */
  var nextId = 1;
  var queue = [], queuePos = 0, decoding = false;
  var stats = { total: 0, done: 0, fail: 0 };

  function key(p) {
    return String(p || '').replace(/^\.\//, '').replace(/^\/+/, '').toLowerCase();
  }

  function ensureCtx() {
    if (AC) return AC;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { return null; }
    master = AC.createGain();
    master.gain.value = 1.0;
    analyser = AC.createAnalyser();
    analyser.fftSize = 2048;
    master.connect(analyser);
    analyser.connect(AC.destination);
    return AC;
  }

  function buildIndex() {
    if (pathIdx || !Module.FS) return;
    pathIdx = {};
    function walk(dir, prefix) {
      var names;
      try { names = Module.FS.readdir(dir); } catch (e) { return; }
      for (var i = 0; i < names.length; i++) {
        var n = names[i];
        if (n === '.' || n === '..') continue;
        var full = dir + '/' + n;
        var rel = prefix + n;
        var st = null;
        try { st = Module.FS.stat(full); } catch (e) { continue; }
        if (Module.FS.isDir(st.mode)) { walk(full, rel + '/'); }
        else { pathIdx[rel.toLowerCase()] = rel; }
      }
    }
    walk('/data', 'data/');
    ['config.lua', 'set.ini', 'hzmb.dat', 'HZMB.DAT'].forEach(function (f) {
      try { Module.FS.stat('/' + f); pathIdx[f.toLowerCase()] = f; } catch (e) {}
    });
  }

  function resolve(p) {
    if (!pathIdx) buildIndex();
    var k = key(p);
    if (pathIdx && pathIdx[k]) return '/' + pathIdx[k];
    return '/' + k;   /* 兜底，按传入路径直接试 */
  }

  function enqueue(paths) {
    queue = queue.concat(paths);
    stats.total = queue.length;
    if (!decoding) pump();
  }

  function pump() {
    if (!AC || queuePos >= queue.length) { decoding = false; return; }
    decoding = true;
    var batch = 6;                      /* 每帧解 6 个，避免卡顿 */
    while (batch-- > 0 && queuePos < queue.length) {
      var rel = queue[queuePos++];
      var k = key(rel);
      if (cache[k]) continue;
      (function (rel, k) {
        var buf;
        try { buf = Module.FS.readFile('/' + rel); }
        catch (e) { stats.fail++; (window.__sfxFail = window.__sfxFail || []).push(rel); return; }
        var ab = new Uint8Array(buf.length);
        ab.set(buf);
        AC.decodeAudioData(ab.buffer, function (audioBuf) {
          cache[k] = audioBuf; stats.done++;
        }, function () { stats.fail++; (window.__sfxFail = window.__sfxFail || []).push(rel); });
      })(rel, k);
    }
    setTimeout(pump, 16);
  }

  function preloadSounds() {
    if (!Module.FS) return;
    var names;
    try { names = Module.FS.readdir('/data/sound'); } catch (e) { return; }
    var list = [];
    for (var i = 0; i < names.length; i++) {
      if (/\.wav$/i.test(names[i])) list.push('data/sound/' + names[i]);
    }
    if (list.length) enqueue(list);
    console.log('[JYAudio] 音效预解码开始，共 ' + list.length + ' 个');
  }

  function playHandle(id) {
    var h = handles[id];
    if (!h) return 0;
    if (h.kind === 'music') return playMusic(id);
    var buf = cache[h.key];
    if (!buf) return 0;                        /* 还没解码好，本次跳过 */
    ensureCtx();
    stopHandle(id);
    var src = AC.createBufferSource();
    src.buffer = buf;
    src.loop = !!h.loop;
    var g = AC.createGain();
    g.gain.value = h.vol;
    src.connect(g); g.connect(master);
    try { src.start(0); } catch (e) { return 0; }
    h.src = src; h.gain = g; h.playing = true;
    (window.__plays = window.__plays || []).push(h.key);
    src.onended = function () { h.playing = false; };
    return 1;
  }

  /* ========== 原版音色：SF2(MIDI) 实时合成（spessasynth） ========== */
  var sf = null, sfPlaying = false, sfName = '';
  function jot(s) { try { document.documentElement.setAttribute('data-jyfs', String(s)); } catch (e) {} }
  function ensureSynth() {
    if (sf) return sf;
    if (!ensureCtx()) return null;
    sf = { loading: true, ready: false, error: '' };
    var ac0 = AC;
    setTimeout(function () {
      console.log('[JYSF] 开始初始化');
      import('./synth.js').then(function (mod) {
        return ac0.audioWorklet.addModule('spessasynth_processor.min.js').then(function () { return mod; });
      }).then(function (mod) {
        var synth = new mod.WorkletSynthesizer(ac0);
        var g = ac0.createGain(); g.gain.value = 0.6;
        synth.connect(g); g.connect(master);
        sf.synth = synth; sf.gain = g; sf.mod = mod; sf.ac = ac0;
        console.log('[JYSF] WorkletSynthesizer 就绪，载入音色库…');
        return (function () {
          var parts = [], i = 1;
          function next() {
            if (i > 40) return Promise.reject(new Error('sf2 分片缺失'));
            var nm = 'mid.sf2.' + ('00' + i).slice(-3);
            return fetch(nm, { cache: 'force-cache' }).then(function (r) {
              if (!r.ok) {
                if (!parts.length) throw new Error('sf2 分片缺失');
                var total = 0; parts.forEach(function (p) { total += p.byteLength; });
                var all = new Uint8Array(total), off = 0;
                parts.forEach(function (p) { all.set(p, off); off += p.byteLength; });
                sf.sf2Buffer = all.buffer;
                return sf.synth.soundBankManager.addSoundBank(all.buffer, 'main');
              }
              return r.arrayBuffer().then(function (ab) { parts.push(new Uint8Array(ab)); i++; return next(); });
            });
          }
          return next();
        })();
      }).then(function () {
        sf.seq = new sf.mod.Sequencer(sf.synth);
        sf.ready = true; sf.loading = false;
        console.log('[JYSF] 音色库载入完成 bytes=' + sf.sf2Buffer.byteLength);
        /* 若初始化期间引擎已请求过 BGM，补播一次 */
        if (sf.pending) { var pid = sf.pending; sf.pending = null; try { sfPlay(pid); } catch (e) {} }
      }).catch(function (e) {
        sf.loading = false; sf.error = String(e);
        console.warn('[JYSF] 初始化失败：', e);
      });
    }, 0);
    return sf;
  }

  function sfPlay(id) {
    var h = handles[id];
    if (!h) return false;
    var s = ensureSynth();
    if (!s) return false;
    if (!s.ready) { s.pending = id; return false; }   /* 初始化中，记住待播曲目 */
    var bytes;
    try { bytes = Module.FS.readFile(resolve(h.key)); } catch (e) { return false; }
    var u8 = new Uint8Array(bytes.length); u8.set(bytes);
    if (!(u8[0] === 0x4D && u8[1] === 0x54 && u8[2] === 0x68 && u8[3] === 0x64)) return false;
    try {
      s.seq.pause();
      s.seq.loadNewSongList([{ binary: u8.buffer, fileName: h.key }]);
      s.seq.loopCount = h.loop ? Infinity : 1;
      s.seq.play();
      sfPlaying = true; sfName = h.key;
      (window.__plays = window.__plays || []).push(h.key + '@sf2');
      console.log('[JYSF] 播放 ' + h.key + ' loop=' + !!h.loop);
      return true;
    } catch (e) { console.warn('[JYSF] play fail', e); return false; }
  }

  function sfStop() {
    if (sf && sf.seq) { try { sf.seq.pause(); } catch (e) {} }
    sfPlaying = false;
    return true;
  }

  /* 旧版振荡器合成：仅在 SF2 尚未就绪时兜底 */
  var musicGain = null;
  var musicCache = {};      /* key -> {notes, dur} */

  function ensureMusicGain() {
    if (!AC) return null;
    if (!musicGain) { musicGain = AC.createGain(); musicGain.gain.value = 0.6; musicGain.connect(master); }
    return musicGain;
  }

  /* 解析 format0/1 的 MIDI，输出音符时间轴（秒） */
  function parseMidi(u8, keyName) {
    if (musicCache[keyName]) return musicCache[keyName];
    var p = 4, hlen = (u8[4] << 24) | (u8[5] << 16) | (u8[6] << 8) | u8[7];
    var ntrk = (u8[10] << 8) | u8[11];
    var div = (u8[12] << 8) | u8[13];
    if (div & 0x8000) div = 96;              /* 不支持 SMPTE，兜底 */
    p = 8 + hlen;

    var tempo = 500000;                      /* 默认 120 BPM */
    var notes = [], dangling = {}, lastTick = 0;

    for (var tr = 0; tr < ntrk && p + 8 <= u8.length; tr++) {
      if (!(u8[p] === 0x4D && u8[p + 1] === 0x54 && u8[p + 2] === 0x72 && u8[p + 3] === 0x6B)) break;
      p += 4;
      var tl = (u8[p] << 24) | (u8[p + 1] << 16) | (u8[p + 2] << 8) | u8[p + 3];
      p += 4;
      var end = Math.min(p + tl, u8.length);
      var tick = 0;

      while (p < end) {
        var dl = 0, b;
        do { b = u8[p++]; dl = (dl << 7) | (b & 0x7F); } while ((b & 0x80) && p < end);
        tick += dl;

        var st = u8[p];
        if (st === 0xFF) {
          p++; var mt = u8[p++]; var len = 0;
          do { b = u8[p++]; len = (len << 7) | (b & 0x7F); } while ((b & 0x80) && p < end);
          if (mt === 0x51 && len >= 3) tempo = (u8[p] << 16) | (u8[p + 1] << 8) | u8[p + 2];
          p += len;
        } else if (st === 0xF0 || st === 0xF7) {
          p++; var len2 = 0;
          do { b = u8[p++]; len2 = (len2 << 7) | (b & 0x7F); } while ((b & 0x80) && p < end);
          p += len2;
        } else {
          var hi = st & 0xF0, ch = st & 0x0F;
          if (st & 0x80) p++;                /* 有状态字节 */
          if (hi === 0x90) {                 /* note on */
            var nn = u8[p], vv = u8[p + 1]; p += 2;
            var k2 = ch + ':' + nn;
            if (vv > 0) { dangling[k2] = { t: tick, n: nn, ch: ch, v: vv }; }
            else { var off = dangling[k2]; if (off) { notes.push({ t: off.t, d: tick - off.t, n: nn, ch: ch, v: off.v }); delete dangling[k2]; } }
          } else if (hi === 0x80) {           /* note off */
            var n2 = u8[p]; p += 2;
            var k3 = ch + ':' + n2, o2 = dangling[k3];
            if (o2) { notes.push({ t: o2.t, d: tick - o2.t, n: n2, ch: ch, v: o2.v }); delete dangling[k3]; }
          } else if (hi === 0xC0 || hi === 0xD0) { p += 1; }
          else { p += 2; }
        }
      }
      p = end;
      if (tick > lastTick) lastTick = tick;
    }

    /* 收尾未闭合的音符 */
    for (var kk in dangling) {
      var d0 = dangling[kk];
      notes.push({ t: d0.t, d: Math.max(48, lastTick - d0.t), n: d0.n, ch: d0.ch, v: d0.v });
    }

    var spb = tempo / 1e6 / div;             /* 每 tick 的秒数 */
    for (var i = 0; i < notes.length; i++) {
      notes[i].ts = notes[i].t * spb;
      notes[i].ds = Math.max(0.05, notes[i].d * spb);
    }
    var dur = lastTick * spb;
    var res = { notes: notes, dur: Math.max(1, dur) };
    musicCache[keyName] = res;
    return res;
  }

  var WAVE_BY_CH = ['triangle', 'triangle', 'sawtooth', 'sine', 'triangle',
                    'triangle', 'square', 'sine', 'sawtooth', 'triangle',
                    'triangle', 'square', 'sine', 'sawtooth', 'triangle', 'triangle'];

  function scheduleNote(nt, when) {
    var g = ensureMusicGain();
    if (!g) return;
    var ch = nt.ch;
    var freq = 440 * Math.pow(2, (nt.n - 69) / 12);

    if (ch === 9) {                          /* 打击乐：短促噪声+低频 */
      var o2 = AC.createOscillator();
      var g2 = AC.createGain();
      o2.type = 'square';
      o2.frequency.value = freq * 2;
      g2.gain.setValueAtTime(0.0001, when);
      g2.gain.linearRampToValueAtTime(0.18 * (nt.v / 127), when + 0.005);
      g2.gain.exponentialRampToValueAtTime(0.0001, when + 0.12);
      o2.connect(g2); g2.connect(g);
      o2.start(when); o2.stop(when + 0.14);
      return;
    }

    var o = AC.createOscillator();
    o.type = WAVE_BY_CH[ch % 16] || 'triangle';
    o.frequency.value = freq;

    /* 第二谐波增厚音色 */
    var o3 = AC.createOscillator();
    o3.type = 'sine';
    o3.frequency.value = freq * 2;

    var gn = AC.createGain();
    var amp = Math.min(0.22, 0.10 + 0.12 * (nt.v / 127));
    gn.gain.setValueAtTime(0.0001, when);
    gn.gain.linearRampToValueAtTime(amp, when + Math.min(0.02, nt.ds * 0.3));
    gn.gain.setValueAtTime(amp, when + Math.max(0.03, nt.ds * 0.7));
    gn.gain.linearRampToValueAtTime(0.0001, when + nt.ds);

    var g3 = AC.createGain(); g3.gain.value = 0.35;
    o.connect(gn); o3.connect(g3); g3.connect(gn);
    gn.connect(g);
    try { o.start(when); o3.start(when); o.stop(when + nt.ds + 0.02); o3.stop(when + nt.ds + 0.02); } catch (e) {}
  }

  function playMusic(id) {
    var h = handles[id];
    if (!ensureCtx()) return 0;
    if (sfPlay(id)) return 1;                /* 原版音色（SF2）优先 */
    if (sf && !sf.ready && !sf.error) return 1;   /* SF2 初始化中：静默等待，避免与旧合成叠音 */
    ensureMusicGain();
    if (h.mid) { stopMusic(id); }            /* 换曲 */
    var data;
    try { data = Module.FS.readFile(resolve(h.key)); } catch (e) { return 1; }
    var u8 = new Uint8Array(data.length); u8.set(data);

    var parsed = parseMidi(u8, h.key);
    if (!parsed.notes.length) return 1;

    h.mid = parsed;
    h.mIdx = 0;
    h.mStart = AC.currentTime + 0.15;
    h.mLooped = !!h.loop;

    var tick = function () {
      if (!h.mid || !h.mPlaying) { h.mTimer = 0; return; }
      var now = AC.currentTime;
      var horiz = now + 1.2;
      while (h.mIdx < h.mid.notes.length && h.mStart + h.mid.notes[h.mIdx].ts < horiz) {
        var nt = h.mid.notes[h.mIdx++];
        var when = h.mStart + nt.ts;
        if (when >= now - 0.05) scheduleNote(nt, when);
      }
      if (h.mIdx >= h.mid.notes.length && now > h.mStart + h.mid.dur) {
        if (h.mLooped) { h.mIdx = 0; h.mStart = now + 0.1; }
        else { h.mPlaying = false; h.mTimer = 0; return; }
      }
      h.mTimer = setTimeout(tick, 120);
    };
    h.mPlaying = true;
    (window.__plays = window.__plays || []).push(h.key + '@midi');
    tick();
    return 1;
  }

  function stopMusic(id) {
    var h = handles[id];
    if (!h) return 0;
    sfStop();
    if (sf) sf.pending = null;
    h.mPlaying = false;
    if (h.mTimer) { clearTimeout(h.mTimer); h.mTimer = 0; }
    h.mid = null;
    return 1;
  }

  function stopHandle(id) {
    var h = handles[id];
    if (!h || !h.src) return 0;
    try { h.src.onended = null; h.src.stop(0); } catch (e) {}
    try { h.src.disconnect(); } catch (e) {}
    h.src = null; h.playing = false;
    return 1;
  }

  return {
    /* ---- 供 C 侧调用 ---- */
    init: function () {
      if (!ensureCtx()) return 0;
      preloadSounds();
      window.__jyAudioReady = true;
      return 1;
    },
    loadSample: function (path) {
      var id = nextId++;
      handles[id] = { kind: 'sfx', key: key(path), vol: 1, loop: false };
      (window.__loads = window.__loads || []).push(path);
      return id;
    },
    loadMusic: function (path) {
      var id = nextId++;
      handles[id] = { kind: 'music', key: key(path), vol: 1, loop: false };
      return id;
    },
    loadFont: function (path) { return 1; },
    play: function (id, loop) {
      var h = handles[id];
      if (h) h.loop = !!loop;
      return playHandle(id);
    },
    stop: function (id) {
      var h = handles[id];
      if (h && h.kind === 'music') return stopMusic(id);
      return stopHandle(id);
    },
    isActive: function (id) {
      var h = handles[id];
      if (!h) return 0;
      if (h.kind === 'music') return (sfPlaying || h.mPlaying) ? 1 : 0;
      return h.playing ? 1 : 0;
    },
    setVolume: function (id, v) {
      var h = handles[id];
      if (!h) return 0;
      h.vol = v;
      if (h.kind === 'music') { if (sf && sf.gain) sf.gain.gain.value = Math.min(1.0, v * 2.4); else if (musicGain) musicGain.gain.value = Math.min(1.0, v * 2.4); }
      else if (h.gain) { h.gain.gain.value = Math.min(1.0, v * 2.5); }
      return 1;
    },
    free: function (id) { stopHandle(id); delete handles[id]; return 1; },

    /* ---- 给页面用 ---- */
    resume: function () {
      if (!ensureCtx()) return 0;
      if (AC.state === 'suspended') AC.resume();
      return 1;
    },
    stats: function () { return { total: stats.total, done: stats.done, fail: stats.fail, cached: Object.keys(cache).length, ctx: AC ? AC.state : 'none' }; },
    /* 实时电平（0..1），用于验证音频真的在输出 */
    level: function () {
      if (!analyser) return -1;
      var buf = new Uint8Array(analyser.fftSize);
      analyser.getByteTimeDomainData(buf);
      var peak = 0;
      for (var i = 0; i < buf.length; i++) { var d = Math.abs(buf[i] - 128); if (d > peak) peak = d; }
      return peak / 128;
    }
  };
})();

/* 首次触摸解锁音频 */
window.addEventListener('pointerdown', function () {
  try { Module.JYAudio && Module.JYAudio.resume(); } catch (e) {}
}, { passive: true });
</script>
<script>
/* game.data（93.8MB）超过 GitHub 网页 25MB 单文件上限，仓库里以 game.data.001~004
   分片存放，由 sw.js 在 fetch 时拼回整包。game.js 必须等 SW 接管后再加载。 */
(function () {
  var started = false;
  function start() {
    if (started) return;
    started = true;
    var s = document.createElement('script');
    s.src = 'game.js';
    document.body.appendChild(s);
  }
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:') {
    start();
    return;
  }
  setTimeout(start, 12000);         // 兜底：SW 12 秒没 ready 就直接加载（start 只执行一次）
  navigator.serviceWorker.register('sw.js').then(function () {
    return navigator.serviceWorker.ready;
  }).then(function () {
    start();                        // activate 里的 clients.claim() 已接管本页，不需要 reload
  }).catch(function (e) {
    console.warn('SW register failed:', e);
    start();
  });
})();
</script>
